<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07070A; }
  * { box-sizing: border-box; }
  [data-composition-id="shot-004"] {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: #C81E3A; color: #EDE7DA;
    font-family: "Cormorant Garamond", "Noto Serif SC", serif;
  }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .frame { position: absolute; inset: 0; transform-origin: 46% 54%; }
  .frame-snap { position: absolute; inset: 0; transform-origin: 60% 46%; }

  #crimson {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 64% 58% at 34% 40%, #E3324E 0%, #C81E3A 38%, #A5162E 72%, #7C0F22 100%);
  }
  #crimsonShade {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 46% 40% at 82% 78%, rgba(60,4,14,0.55) 0%, rgba(60,4,14,0) 62%),
      radial-gradient(ellipse 40% 34% at 12% 16%, rgba(255,140,150,0.18) 0%, rgba(255,140,150,0) 66%);
  }
  #printOnRed {
    position: absolute; inset: 0; opacity: 0.5; mix-blend-mode: multiply;
    background-image: radial-gradient(circle, rgba(124,15,34,0.85) 1px, rgba(124,15,34,0) 1.6px);
    background-size: 8px 8px;
  }

  /* ---------- cape sweeping away ---------- */
  #capeBack {
    position: absolute; inset: -40px;
    background: linear-gradient(102deg, #07070A 0%, #0b0a10 46%, #1a0a12 78%, #2a0a16 100%);
    clip-path: polygon(0% 0%, 104% 0%, 104% 104%, 0% 104%);
  }
  #capeEdge {
    position: absolute; inset: -40px;
    background: linear-gradient(100deg, rgba(237,231,218,0) 0%, rgba(237,231,218,0.55) 42%, rgba(237,231,218,0.08) 72%, rgba(237,231,218,0) 100%);
    clip-path: polygon(0% 0%, 104% 0%, 104% 104%, 0% 104%);
  }
  #flash { position: absolute; inset: 0; background: #FFFDF7; }

  /* ---------- frame rule ---------- */
  #frameRule {
    position: absolute; left: 118px; top: 112px; right: 118px; bottom: 112px;
    border: 1.5px solid rgba(212,175,106,0.55);
    box-shadow: inset 0 0 0 1px rgba(237,231,218,0.10);
  }
  #frameRuleInner {
    position: absolute; left: 10px; top: 10px; right: 10px; bottom: 10px;
    border: 1px solid rgba(237,231,218,0.18);
  }

  /* ---------- type ---------- */
  .type-layer { position: absolute; inset: 0; z-index: 25; }
  #lineA {
    position: absolute; left: 166px; top: 272px;
    font-family: "Cinzel", serif; font-size: 158px; font-weight: 700;
    letter-spacing: 0.13em; line-height: 1; color: #EDE7DA;
    text-shadow: 0 10px 40px rgba(60,4,14,0.45);
  }
  #lineB {
    position: absolute; left: 166px; top: 446px;
    font-family: "Cinzel", serif; font-size: 158px; font-weight: 700;
    letter-spacing: 0.40em; line-height: 1; color: #EDE7DA;
    text-shadow: 0 10px 40px rgba(60,4,14,0.45);
  }
  #cnWrap { position: absolute; left: 170px; top: 688px; }
  #cn {
    position: relative; z-index: 2;
    font-family: "Noto Serif SC", serif; font-size: 168px; font-weight: 900;
    letter-spacing: 0.16em; line-height: 1; color: #EDE7DA;
    text-shadow: 16px 12px 0 rgba(74,8,20,0.85), 0 12px 46px rgba(60,4,14,0.5);
  }
  
  #hair { position: absolute; left: 170px; top: 906px; width: 880px; height: 2px; background: linear-gradient(to right, rgba(237,231,218,0.85), rgba(237,231,218,0.25) 70%, rgba(237,231,218,0)); transform-origin: 0% 50%; }
  #micro {
    position: absolute; left: 172px; top: 930px;
    font-family: "Cinzel", serif; font-size: 18px; font-weight: 600;
    letter-spacing: 0.44em; color: rgba(237,231,218,0.72);
  }

  /* ---------- seal ---------- */
  #seal {
    position: absolute; left: 1452px; top: 646px; width: 268px; height: 268px;
    border: 4px solid rgba(237,231,218,0.82); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #sealInner {
    position: absolute; left: 12px; top: 12px; right: 12px; bottom: 12px;
    border: 1.5px dashed rgba(237,231,218,0.55); border-radius: 50%;
  }
  #sealText {
    position: relative; z-index: 2;
    font-family: "Noto Serif SC", serif; font-size: 76px; font-weight: 900;
    letter-spacing: 0.08em; color: #EDE7DA; text-indent: 0.08em;
    text-shadow: 10px 8px 0 rgba(74,8,20,0.8);
  }
  
  #impact {
    position: absolute; left: 1452px; top: 646px; width: 268px; height: 268px;
    border: 3px solid rgba(237,231,218,0.8); border-radius: 50%;
    opacity: 0;
  }

  /* ---------- grade ---------- */
  #filmGrain { position: absolute; inset: 0; opacity: 0.24; mix-blend-mode: overlay; background-repeat: repeat; background-size: 256px 256px; }
  #vignettePlate {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 62% at 50% 48%, rgba(124,15,34,0) 34%, rgba(96,10,26,0.42) 74%, rgba(52,4,12,0.86) 100%),
      linear-gradient(to bottom, rgba(60,4,14,0.55) 0%, rgba(60,4,14,0) 26%, rgba(60,4,14,0) 70%, rgba(60,4,14,0.62) 100%);
  }
  .bar { position: absolute; left: 0; width: 100%; height: 82px; background: #07070A; z-index: 30; }
  .bar-top { top: 0; box-shadow: 0 3px 16px rgba(7,7,10,0.95); }
  .bar-bot { bottom: 0; box-shadow: 0 -3px 16px rgba(7,7,10,0.95); }

<body>
<div data-composition-id="shot-004" data-width="1920" data-height="1080" data-duration="5.6" data-start="0">
  <div class="scene" data-layout-allow-overflow>
    <div class="frame">
      <div class="frame-snap">
        <div id="crimson"></div>
        <div id="crimsonShade"></div>
        <div id="printOnRed"></div>
        <div id="frameRule"><div id="frameRuleInner"></div></div>
      </div>
    </div>
  </div>

  <div id="capeBack" class="clip" data-start="0" data-duration="5.6" data-track-index="5"></div>
  <div id="capeEdge" class="clip" data-start="0" data-duration="5.6" data-track-index="6"></div>

  <div class="type-layer">
    <div id="lineA">PHANTOM</div>
    <div id="lineB">THIEF</div>
    <div id="cnWrap" data-layout-allow-overlap>
      <span id="cn">怪盗</span>
    </div>
    <div id="hair"></div>
    <div id="micro">NOTICE OF ARRIVAL — MMXXVI</div>
    <div id="seal" data-layout-allow-overlap>
      <div id="sealInner"></div>
      <span id="sealText">怪盗</span>
    </div>
    <div id="impact"></div>
  </div>

  <div id="flash" class="clip" data-start="0" data-duration="5.6" data-track-index="7"></div>
  <div id="filmGrain" class="clip" data-start="0" data-duration="5.6" data-track-index="9"></div>
  <div id="vignettePlate" class="clip" data-start="0" data-duration="5.6" data-track-index="10"></div>

  <span class="bar bar-top"></span>
  <span class="bar bar-bot"></span>
</div>

<script>
(function () {
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(30417);

  // film grain tile
  var tile = document.createElement('canvas');
  tile.width = 256; tile.height = 256;
  var ctx = tile.getContext('2d');
  var img = ctx.createImageData(256, 256);
  for (var q = 0; q < img.data.length; q += 4) {
    var v = Math.floor(rng() * 255);
    img.data[q] = v; img.data[q + 1] = v; img.data[q + 2] = v;
    img.data[q + 3] = Math.floor(rng() * 110);
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById('filmGrain').style.backgroundImage = 'url(' + tile.toDataURL('image/png') + ')';

  var tl = gsap.timeline({ paused: true });

  // 1. blow out from the previous frame's flash, then the cape wipes the picture red
  tl.fromTo('#flash', { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power2.in' }, 0);
  tl.fromTo('#capeBack',
    { clipPath: 'polygon(0% 0%, 132% 0%, 116% 104%, -16% 104%)' },
    { clipPath: 'polygon(112% 0%, 132% 0%, 116% 104%, 96% 104%)', duration: 0.85, ease: 'power3.inOut' }, 0.03);
  tl.fromTo('#capeEdge',
    { clipPath: 'polygon(0% 0%, 132% 0%, 116% 104%, -16% 104%)' },
    { clipPath: 'polygon(112% 0%, 132% 0%, 116% 104%, 96% 104%)', duration: 0.85, ease: 'power3.inOut' }, 0.03);

  // 2. the frame rules in
  tl.fromTo('#frameRule', { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.9, ease: 'power3.out' }, 0.5);

  // 3. the name arrives from opposite sides
  tl.fromTo('#lineA', { opacity: 0, x: -190 }, { opacity: 1, x: 0, duration: 0.78, ease: 'power4.out' }, 0.86);
  tl.fromTo('#lineB', { opacity: 0, x: 240 }, { opacity: 1, x: 0, duration: 0.82, ease: 'power4.out' }, 1.2);

  // 4. the Chinese lockup stamps in
  tl.fromTo('#cnWrap', { opacity: 0, scale: 1.18, y: 34 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 1.72);
  tl.fromTo('#hair', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power3.inOut' }, 2.0);
  tl.fromTo('#micro', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 2.2);

  // 5. the seal slams down
  tl.fromTo('#seal', { opacity: 0, scale: 1.9, rotate: -19 }, { opacity: 1, scale: 1, rotate: -7, duration: 0.34, ease: 'power4.out' }, 2.34);
  tl.fromTo('#impact', { opacity: 0.9, scale: 0.9 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: 'power2.out', immediateRender: false }, 2.42);

  // 6. camera creeps for the hold, then a small snap on the seal hit
  tl.fromTo('.frame', { scale: 1 }, { scale: 1.062, duration: 5.6, ease: 'none' }, 0);
  tl.fromTo('.frame-snap', { scale: 1 }, { scale: 1.028, duration: 0.26, ease: 'power4.out' }, 2.34);

  // 7. grain flicker
  for (var g = 0; g < 68; g++) {
    var gx = Math.floor(rng() * 256);
    var gy = Math.floor(rng() * 256);
    tl.set('#filmGrain', { backgroundPosition: gx + 'px ' + gy + 'px' }, g * 0.083);
  }

  window.__timelines['shot-004'] = tl;
})();
</script>
</div>
</body>
