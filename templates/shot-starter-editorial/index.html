<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shot-starter-editorial — System C · Editorial Paper / Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ── 设计令牌：改镜头先改这里 ───────────────────────────────── */
  :root {
    --paper: #F3EDE1;       /* 纸底 */
    --paper-deep: #E7DECB;  /* 纸背 / 叠层 */
    --paper-hi: #FBF7EC;    /* 图版纸（比页纸更亮一档） */
    --ink: #1E1A16;         /* 主墨 */
    --ink-soft: #4A4238;    /* 次墨（对纸底 ≈8.5:1） */
    --rule: #C9BBA2;        /* 纸规线 */
    --rubric: #B23A2E;      /* 朱批（对纸底 ≈5.1:1） */
    --museum: #2F5D7C;      /* 博物馆蓝：图版框 */
    --leaf: #B8892F;        /* 金箔：极少量 */
    --font-serif: "Noto Serif SC", serif;
    --font-display: "Cormorant Garamond", serif;
    --font-sans: "Noto Sans SC", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; background: var(--paper); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
  .clip { position: absolute; inset: 0; }
  #fiber rect, #tooth rect { mix-blend-mode: multiply; }

  /* L0 纸底：暖白渐变 + 老化色斑 + 暖色纸边暗角 */
  #paper { z-index: 0; }
  #paper .paper__base { position: absolute; inset: 0; display: block;
    background: linear-gradient(166deg, #F8F3E8 0%, #F3EDE1 48%, #EBE1D0 100%); }
  #paper .paper__blotch { position: absolute; inset: 0; display: block;
    background:
      radial-gradient(36% 30% at 24% 16%, rgba(184,137,47,.075) 0%, rgba(184,137,47,0) 72%),
      radial-gradient(30% 26% at 82% 80%, rgba(160,128,74,.085) 0%, rgba(160,128,74,0) 70%),
      radial-gradient(44% 32% at 58% 6%, rgba(120,96,60,.055) 0%, rgba(120,96,60,0) 74%); }
  #paper .paper__edge { position: absolute; inset: 0; display: block;
    background: radial-gradient(78% 72% at 50% 46%, rgba(120,96,60,0) 58%, rgba(120,96,60,.16) 100%); }

  /* L1 纸纤维：低频湍流 + 正片叠底（确定性，seed 固定） */
  #fiber { z-index: 1; pointer-events: none; }

  /* L2 纸片叠层：图版下的两张垫纸，露出 8–14px 错位 */
  #sheets { z-index: 2; pointer-events: none; }
  #sheets .sheet { position: absolute; display: block; background: var(--paper-deep);
    box-shadow: 0 2px 0 rgba(30,26,22,.05), 0 14px 34px rgba(30,26,22,.14); }
  #sheets .sheet--a { left: 806px; top: 118px; width: 760px; height: 704px; background: #EBE3D2; }
  #sheets .sheet--b { left: 820px; top: 124px; width: 760px; height: 698px; }

  /* L3 图版：双线框（博物馆蓝）+ 铜版线刻 + 剖面插图 + 朱批 */
  #plate { z-index: 3; pointer-events: none; }

  /* L4 前景：压过图版边缘的纸片 + 纤维浮尘 */
  #fore { z-index: 4; pointer-events: none; }

  /* L5 左栏排版：页眉 / 大标题 / 引文 / 正文 */
  #type { z-index: 5; pointer-events: none; }
  #type span { white-space: nowrap; }
  #type .type__head { position: absolute; left: 120px; top: 104px; display: block;
    font-family: var(--font-mono); font-size: 14px; font-weight: 400; letter-spacing: .34em; color: var(--ink-soft); }
  #type .type__rule { position: absolute; left: 120px; top: 140px; display: block; width: 112px; height: 1px;
    background: var(--rule); transform-origin: left center; }
  #type .type__title { position: absolute; left: 118px; top: 172px; display: block;
    font-family: var(--font-serif); font-size: 104px; font-weight: 700; line-height: 1.16; letter-spacing: .02em; color: var(--ink); }
  #type .type__quote { position: absolute; left: 120px; top: 336px; display: block;
    font-family: var(--font-display); font-style: italic; font-size: 48px; font-weight: 500; line-height: 1.3;
    letter-spacing: .01em; color: var(--ink-soft); }
  #type .type__body { position: absolute; left: 120px; display: block;
    font-family: var(--font-serif); font-size: 34px; font-weight: 400; line-height: 1.7; letter-spacing: .03em; color: var(--ink); }
  #type .type__body--a { top: 458px; }
  #type .type__body--b { top: 516px; }
  #type .type__res-rule { position: absolute; left: 120px; top: 624px; display: block; width: 128px; height: 1px;
    background: var(--museum); transform-origin: left center; }
  #type .type__res-bar { position: absolute; left: 120px; top: 654px; display: block; width: 3px; height: 34px;
    background: var(--rubric); transform-origin: top center; }
  #type .type__res { position: absolute; left: 140px; top: 650px; display: block;
    font-family: var(--font-serif); font-size: 36px; font-weight: 400; line-height: 1.2; letter-spacing: .06em; color: var(--ink); }
  #type .type__res-en { position: absolute; left: 142px; top: 704px; display: block;
    font-family: var(--font-mono); font-size: 14px; font-weight: 400; letter-spacing: .26em; color: var(--ink-soft); }
  #type .type__foot { position: absolute; left: 120px; top: 840px; display: block;
    font-family: var(--font-mono); font-size: 14px; font-weight: 400; letter-spacing: .20em; color: var(--ink-soft); }

  /* L6 图注：贴图版左下，间距 16px */
  #caption { z-index: 6; pointer-events: none; }
  #caption span { white-space: nowrap; }
  #caption .cap__num { position: absolute; left: 792px; top: 844px; display: block;
    font-family: var(--font-mono); font-size: 16px; font-weight: 500; letter-spacing: .24em; color: var(--rubric); }
  #caption .cap__text { position: absolute; left: 900px; top: 838px; display: block;
    font-family: var(--font-sans); font-size: 22px; font-weight: 400; letter-spacing: .04em; color: var(--ink-soft); }

  /* L7 图例：右侧外白边（书的订口外缘） */
  #legend { z-index: 7; pointer-events: none; }
  #legend span { white-space: nowrap; }
  #legend .lg { position: absolute; display: block; }
  #legend .lg__head { left: 1600px; top: 458px;
    font-family: var(--font-mono); font-size: 14px; font-weight: 400; letter-spacing: .30em; color: var(--ink-soft); }
  #legend .lg__n { font-family: var(--font-mono); font-size: 16px; font-weight: 500; letter-spacing: .1em; color: var(--rubric); }
  #legend .lg__t { font-family: var(--font-sans); font-size: 22px; font-weight: 400; letter-spacing: .04em; color: var(--ink-soft); }
  #legend .lg__n--a { left: 1602px; top: 504px; } #legend .lg__t--a { left: 1628px; top: 498px; }
  #legend .lg__n--b { left: 1602px; top: 548px; } #legend .lg__t--b { left: 1628px; top: 542px; }
  #legend .lg__n--c { left: 1602px; top: 592px; } #legend .lg__t--c { left: 1628px; top: 586px; }

  /* L8 结构线：1px 竖规线贯穿 + 四角裁切标记 + 朱印 */
  #frame { z-index: 8; pointer-events: none; }
  /* L9 纸齿：高频细颗粒，压在全部文字之上（极轻） */
  #tooth { z-index: 9; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="shot-starter-editorial" data-start="0" data-width="1920" data-height="1080" data-duration="8">

  <div id="paper" class="clip" data-start="0" data-duration="8" data-track-index="0" data-layout-allow-caption-zone>
    <span class="paper__base"></span><span class="paper__blotch"></span><span class="paper__edge"></span>
  </div>

  <svg id="fiber" class="clip" data-start="0" data-duration="8" data-track-index="1" data-layout-allow-caption-zone viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <filter id="paper-fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="5" seed="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".30" intercept=".72"></feFuncR>
        <feFuncG type="linear" slope=".30" intercept=".72"></feFuncG>
        <feFuncB type="linear" slope=".30" intercept=".72"></feFuncB>

    </filter>
    <rect id="fiber-tex" x="0" y="0" width="1920" height="1080" filter="url(#paper-fiber)"></rect>

  <div id="sheets" class="clip" data-start="0" data-duration="8" data-track-index="2" data-layout-allow-overflow data-layout-allow-caption-zone>

      <g id="frame-rules" fill="none" stroke="#2F5D7C">
        <rect id="rule-outer" x="792" y="112" width="760" height="716" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke-width="1.8" stroke-opacity=".74"></rect>
        <rect id="rule-inner" x="800" y="120" width="744" height="700" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke-width=".9" stroke-opacity=".55"></rect>

        <path id="stem-b" class="stem" d="M1185 621 C1180 661 1168 729 1157 769" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke-width="1.2" stroke-opacity=".7"></path>
        <g id="veins"></g>
        <g id="inset" stroke-width=".8" stroke-opacity=".85">
          <rect x="840" y="624" width="236" height="138" fill="#FBF7EC" stroke-width="1.6" stroke-opacity=".95"></rect>

        </g>
        <g id="leaders" stroke-width=".9">

          <path id="ld-b" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M1330 486 L1372 452"></path>
          <path id="ld-c" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M1016 756 L1064 782"></path>
        </g>
        <g id="scalebar">
          <path d="M1340 796 H1460" stroke-width="1.2"></path>
          <path d="M1340 790 V802 M1370 792 V800 M1400 790 V802 M1430 792 V800 M1460 790 V802" stroke-width=".9" stroke-opacity=".8"></path>
        </g>
      </g>
      <g id="numerals" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" fill="#B23A2E" letter-spacing="1.2">
        <text class="numeral" id="num-a" x="1130" y="600" text-anchor="end">1</text>
        <text class="numeral" id="num-b" x="1382" y="448">2</text>

      </g>

      <g id="marks" fill="none" stroke="#B23A2E" stroke-linecap="round">

        <path id="mark-underline" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke-width="3" d="M120 312 C240 305 402 319 566 309"></path>
      </g>
    </g>
  </svg>

  <svg id="fore" class="clip" data-start="0" data-duration="8" data-track-index="4" data-layout-allow-overflow data-layout-allow-caption-zone viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>

        <stop offset="0%" stop-color="#F8F3E8"></stop><stop offset="100%" stop-color="#E7DECB"></stop>
      </linearGradient>
      <filter id="chip-shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15"></feGaussianBlur></filter>
    </defs>
    <g id="chip-move">
      <g transform="rotate(-3.2 1642 872)">
        <rect x="1516" y="806" width="252" height="132" rx="2" fill="#3A2E1C" opacity=".2" filter="url(#chip-shadow)"></rect>
        <rect x="1516" y="806" width="252" height="132" rx="1" fill="url(#chip-fill)" stroke="#C9BBA2" stroke-width="1"></rect>
        <path d="M1538 842 H1726 M1538 862 H1690 M1538 882 H1712" stroke="#C9BBA2" stroke-width="1" stroke-opacity=".85" fill="none"></path>
      </g>
    </g>
    <g id="fibers" fill="none" stroke="#4A4238" stroke-width="1" stroke-linecap="round" stroke-opacity=".42">

      <path class="fib" d="M286 612 C320 606 352 614 386 606"></path>
      <path class="fib" d="M520 748 C556 742 588 750 620 742"></path>
      <path class="fib" d="M1058 196 C1090 190 1120 198 1148 192"></path>
      <path class="fib" d="M640 340 C676 334 706 342 738 336"></path>
    </g>
  </svg>

  <div id="type" class="clip" data-start="0" data-duration="8" data-track-index="5">
    <span class="type__head">HERBARIUM · IV</span>
    <span class="type__rule"></span>
    <span class="type__title">叶脉的秩序</span>
    <span class="type__quote">Ginkgo biloba</span>
    <span class="type__body type__body--a">诸脉自基部放射</span>
    <span class="type__body type__body--b">逐级二分</span>
    <span class="type__res-rule"></span>
    <span class="type__res-bar"></span>
    <span class="type__res">二叉脉序</span>
    <span class="type__res-en">DICHOTOMOUS</span>
    <span class="type__foot">GINKGO · 1908</span>
  </div>

  <div id="caption" class="clip" data-start="0" data-duration="8" data-track-index="6">
    <span class="cap__num">FIG. 04</span><span class="cap__text">叶背 · 脉序</span>
  </div>

  <div id="legend" class="clip" data-start="0" data-duration="8" data-track-index="7">
    <span class="lg lg__head">LEGEND</span>
    <span class="lg lg__n lg__n--a">1</span><span class="lg lg__t lg__t--a">放射基</span>
    <span class="lg lg__n lg__n--b">2</span><span class="lg lg__t lg__t--b">分叉</span>
    <span class="lg lg__n lg__n--c">3</span><span class="lg lg__t lg__t--c">气孔</span>
  </div>

  <svg id="frame" class="clip" data-start="0" data-duration="8" data-track-index="8" data-layout-allow-overflow viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" fill="none">
    <line id="gutter" x1="776" y1="96" x2="776" y2="886" stroke="#C9BBA2" stroke-width="1" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"></line>
    <g stroke="#C9BBA2" stroke-width="1" stroke-opacity=".9" pathLength="1">
      <path d="M64 88 V64 H88"></path><path d="M1832 64 H1856 V88"></path>
      <path d="M1856 992 V1016 H1832"></path><path d="M88 1016 H64 V992"></path>
    </g>
    <g id="stamp"><g transform="rotate(-4 1691 691)" stroke="#B23A2E" stroke-width="1.6" stroke-opacity=".75">
      <rect x="1668" y="668" width="46" height="46"></rect><path d="M1668 691 H1714"></path>
    </g></g>
  </svg>

  <svg id="tooth" class="clip" data-start="0" data-duration="8" data-track-index="9" data-layout-allow-caption-zone viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <filter id="paper-tooth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".92" numOctaves="3" seed="11" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".22" intercept=".80"></feFuncR>
        <feFuncG type="linear" slope=".22" intercept=".80"></feFuncG>

      </feComponentTransfer>
    </filter>

  </svg>
</div>

<script src="assets/gsap.min.js"></script>

<script>
  /* 时间轴在字体就绪后构建并注册，保证字宽/换行与最终渲染一致 */
  document.fonts.ready.then(function () {
    var tl = window.__buildShotTimeline();
    window.__timelines['shot-starter-editorial'] = tl;
    if (typeof window.__hfForceTimelineRebind === 'function') window.__hfForceTimelineRebind();
  });
</script>
</body>
