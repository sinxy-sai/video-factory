<style>
  /* ── 设计令牌：系统 D 霓虹东京，改镜头先改这里 ─────────────────── */
  :root {
    --night-0: #05030A;   /* 画布底 */
    --night-1: #0B0616;   /* 深紫黑：渐变 / 面板 */
    --panel:   #120B22;   /* HUD 卡片 / 终端 */
    --paper:   #F2F5FF;   /* 主文字 */
    --mist:    #A6B2CC;   /* 次级文字 */
    --magenta: #FF2E88;   /* 主强调 / 当前项 */
    --cyan:    #00E5FF;   /* 数据 / 进度 */
    --lime:    #B6FF3C;   /* 成功 / 在线 */
    --amber:   #FFB020;   /* 警示 */
    --violet:  #7A5CFF;   /* 辅助 / 渐变过渡 */
    --line:    rgba(122, 92, 255, .30);
    --line-hi: rgba(0, 229, 255, .40);
    --font-sans: "Noto Sans SC", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; background: var(--night-0); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night-0); color: var(--paper); }
  .clip { position: absolute; inset: 0; }

  /* L0 大气：底色 / 双色霓虹雾 / 三面压暗 scrim */
  #sky { z-index: 0; }
  #sky span { position: absolute; display: block; }
  .sky__base { inset: 0; background:
      radial-gradient(72% 54% at 50% 54%, #1A1140 0%, #0B0616 46%, #05030A 82%),
      linear-gradient(180deg, #05030A 0%, #0B0616 40%, #090418 74%, #05030A 100%); }
  .sky__glow-c { left: 280px; top: 110px; width: 1420px; height: 1020px; filter: blur(9px);
    background: radial-gradient(closest-side, rgba(0,229,255,.15) 0%, rgba(122,92,255,.09) 46%, rgba(5,3,10,0) 78%); }
  .sky__glow-m { left: -280px; top: 520px; width: 1120px; height: 840px; filter: blur(11px);
    background: radial-gradient(closest-side, rgba(255,46,136,.20) 0%, rgba(255,46,136,.05) 46%, rgba(5,3,10,0) 80%); }
  .sky__glow-v { right: -220px; top: -200px; width: 1080px; height: 940px; filter: blur(12px);
    background: radial-gradient(closest-side, rgba(122,92,255,.17) 0%, rgba(122,92,255,.04) 52%, rgba(5,3,10,0) 80%); }
  .sky__scrim-l { left: 0; top: 0; width: 1020px; height: 1080px;
    background: linear-gradient(96deg, rgba(5,3,10,.93) 0%, rgba(5,3,10,.66) 34%, rgba(5,3,10,0) 76%); }
  .sky__scrim-r { right: 0; top: 0; width: 680px; height: 1080px;
    background: linear-gradient(264deg, rgba(5,3,10,.91) 0%, rgba(5,3,10,.54) 40%, rgba(5,3,10,0) 80%); }
  .sky__scrim-b { left: 0; bottom: 0; width: 1920px; height: 340px;
    background: linear-gradient(0deg, rgba(5,3,10,.78) 0%, rgba(5,3,10,0) 100%); }

  /* L1 透视网格走廊 + 线框城市 */ #field { z-index: 1; }
  /* L2 数据核心：主体 */ #core { z-index: 2; }

  /* L3 前景：光斑 + 浮尘（压过主体边缘制造景深） */
  #fore { z-index: 3; pointer-events: none; }
  #fore .mote { position: absolute; display: block; border-radius: 50%; filter: blur(4px);
    background: radial-gradient(circle, rgba(242,245,255,.55) 0%, rgba(242,245,255,0) 70%); }
  .mote--a { left: 1216px; top: 236px; width: 22px; height: 22px; opacity: .34; }
  .mote--b { left: 1494px; top: 766px; width: 16px; height: 16px; opacity: .28; }
  .mote--c { left: 648px; top: 186px; width: 12px; height: 12px; opacity: .24; }
  .mote--d { left: 1178px; top: 862px; width: 28px; height: 28px; opacity: .18; }
  #fore .bokeh { position: absolute; display: block; border-radius: 50%; filter: blur(26px); }
  .bokeh--a { left: 540px; top: 748px; width: 230px; height: 230px; opacity: .55;
    background: radial-gradient(circle, rgba(0,229,255,.22) 0%, rgba(0,229,255,0) 72%); }
  .bokeh--b { left: 1088px; top: 116px; width: 160px; height: 160px; opacity: .34;
    background: radial-gradient(circle, rgba(255,46,136,.20) 0%, rgba(255,46,136,0) 72%); }

  /* L4 扫描光带：一次“测量”动作 */ #sweep { z-index: 4; pointer-events: none; }
  #sweep .sweep__beam { position: absolute; display: block; top: 0; left: 0; width: 420px; height: 1080px; opacity: 0;
    background: linear-gradient(90deg, rgba(0,229,255,0) 0%, rgba(0,229,255,.05) 58%, rgba(180,250,255,.14) 90%, rgba(242,245,255,.34) 98%, rgba(242,245,255,0) 100%);
    border-right: 1px solid rgba(150,250,255,.8); }

  /* L5 暗角：压在场景上、文字下 */ #vignette { z-index: 5; pointer-events: none; }
  .vignette__fill { position: absolute; inset: 0; display: block;
    background: radial-gradient(76% 68% at 54% 48%, rgba(5,3,10,0) 40%, rgba(5,3,10,.42) 72%, rgba(5,3,10,.86) 100%),
                linear-gradient(180deg, rgba(5,3,10,.42) 0%, rgba(5,3,10,0) 22%, rgba(5,3,10,0) 70%, rgba(5,3,10,.56) 100%); }

  /* L6 左栏排版：eyebrow → 标题 → hero 数据 → 单位 → 终端 → 注释 */
  #type { z-index: 6; pointer-events: none; }
  #type > span { position: absolute; display: block; white-space: nowrap; }
  .t-eyebrow { left: 156px; top: 148px; font-family: var(--font-mono); font-size: 15px; font-weight: 400;
    letter-spacing: .30em; color: var(--magenta); }
  .t-title { left: 156px; top: 186px; font-family: var(--font-sans); font-size: 76px; font-weight: 900;
    line-height: 1.02; letter-spacing: -.01em; color: var(--paper);
    text-shadow: -1px 0 rgba(255,46,136,.45), 1px 0 rgba(0,229,255,.42), 0 0 36px rgba(0,229,255,.16); }
  .t-rule { left: 156px; top: 292px; width: 268px; height: 1px; background: var(--line); }
  .t-hero { left: 150px; top: 316px; font-family: var(--font-mono); font-size: 148px; font-weight: 500;
    line-height: .9; letter-spacing: -.02em; color: var(--cyan); font-variant-numeric: tabular-nums;
    text-shadow: -1px 0 rgba(255,46,136,.5), 1px 0 rgba(0,229,255,.45), 0 0 14px rgba(0,229,255,.5), 0 0 48px rgba(0,229,255,.26); }
  .t-rule-live { left: 156px; top: 468px; width: 132px; height: 2px; background: var(--magenta);
    box-shadow: 0 0 10px rgba(255,46,136,.9); }
  .t-unit { left: 156px; top: 496px; font-family: var(--font-sans); font-size: 24px; font-weight: 400;
    letter-spacing: .04em; color: var(--mist); }
  .t-unit-en { left: 300px; top: 501px; font-family: var(--font-mono); font-size: 13px; font-weight: 400;
    letter-spacing: .22em; color: var(--mist); }
  .t-line { font-family: var(--font-mono); font-size: 25px; font-weight: 400; line-height: 1.6;
    letter-spacing: .02em; color: var(--mist); }
  .t-line--1 { left: 156px; top: 560px; }
  .t-line--2 { left: 156px; top: 600px; }
  .t-line--3 { left: 156px; top: 640px; }
  .t-line--4 { left: 156px; top: 680px; }
  .t-p { color: var(--magenta); opacity: 0; }
  .t-note { left: 156px; top: 744px; font-family: var(--font-sans); font-size: 23px; font-weight: 400;
    line-height: 1.4; letter-spacing: .04em; color: var(--mist); }

  /* L6b 核心状态字样（叠在暗角之上，随主体 whip pan）*/
  #corelabel { z-index: 6; pointer-events: none; }
  #cl-rig { position: absolute; inset: 0; display: block; }
  #cl-rig span { position: absolute; left: 810px; top: 288px; width: 240px; display: block;
    text-align: center; white-space: nowrap; font-family: var(--font-mono); font-size: 15px;
    font-weight: 400; letter-spacing: .28em; }
  .cl-a { color: var(--magenta); }
  .cl-b { color: var(--lime); opacity: 0; }

  /* L7 右栏 HUD 数据列 */
  #hud { z-index: 7; pointer-events: none; }
  #hud > span { position: absolute; display: block; white-space: nowrap; }
  .h-head { right: 156px; top: 148px; font-family: var(--font-mono); font-size: 15px; font-weight: 400;
    letter-spacing: .28em; color: var(--magenta); text-align: right; }
  .h-rule { right: 156px; top: 188px; width: 288px; height: 1px; background: var(--line-hi); }
  .h-ladder { right: 444px; top: 216px; width: 10px; height: 292px;
    background: repeating-linear-gradient(180deg, rgba(122,92,255,.5) 0 1px, rgba(122,92,255,0) 1px 12px); }
  .h-k { left: 1500px; font-family: var(--font-mono); font-size: 14px; font-weight: 400;
    letter-spacing: .22em; color: var(--mist); }
  .h-v { right: 156px; font-family: var(--font-mono); font-size: 20px; font-weight: 500;
    letter-spacing: .04em; color: var(--paper); text-align: right; }
  .h-track { right: 156px; width: 288px; height: 1px; background: rgba(242,245,255,.14); }
  .h-fill { right: 156px; width: 288px; height: 2px; background: var(--cyan); }
  .h-status { left: 1500px; top: 536px; font-family: var(--font-mono); font-size: 14px; font-weight: 400;
    letter-spacing: .22em; color: var(--amber); }

  /* L8 顶部界面条 */ #scale { z-index: 8; }
  /* L9 HUD 边角括号 */ #frame { z-index: 9; }
  /* L10 颗粒：feTurbulence 静帧 */ #grain { z-index: 10; opacity: .085; mix-blend-mode: overlay; pointer-events: none; }
  /* L11 扫描线 + 故障切片：最后叠加 */
  #texture { z-index: 11; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(242,245,255,.055) 0 1px, rgba(5,3,10,0) 1px 4px); }
  #glitch { position: absolute; inset: 0; display: block; opacity: 0; }
  #glitch i { position: absolute; display: block; left: 0; width: 1920px; }
  #glitch .g1 { top: 232px; height: 6px;
    background: linear-gradient(90deg, rgba(255,46,136,0) 0%, rgba(255,46,136,.72) 22%, rgba(0,229,255,.7) 62%, rgba(0,229,255,0) 100%); }
  #glitch .g2 { top: 636px; height: 10px;
    background: linear-gradient(90deg, rgba(0,229,255,0) 0%, rgba(0,229,255,.66) 34%, rgba(255,46,136,.62) 74%, rgba(255,46,136,0) 100%); }
  #glitch .g3 { top: 878px; height: 4px;
    background: linear-gradient(90deg, rgba(255,46,136,0) 0%, rgba(255,46,136,.6) 48%, rgba(0,229,255,0) 100%); }
</style>
